<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dettaglio giorno — Giappone</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ccircle cx='5' cy='5' r='4' fill='%23c2410c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top top-sm">
  <div class="top-bar">
    <a href="index.html" class="back">← Panoramica</a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambia tema"></button>
  </div>
  <div id="global-search" class="global-search"></div>
</header>

<main>
  <div class="day-header">
    <div class="eyebrow" id="d-weekday"></div>
    <h1 id="d-title"></h1>
    <span class="pill" id="d-hotel"></span>
  </div>

  <div id="d-notes"></div>

  <div id="d-map-box">
    <div id="d-map" class="map-box map-box-sm"></div>
    <p class="hint">I numeri sui pin corrispondono a quelli accanto agli orari: toccane uno per vederlo sulla mappa.</p>
    <a id="d-map-route" class="link-btn" href="#" target="_blank" rel="noopener" hidden>Percorso del giorno su Google Maps ↗</a>
  </div>

  <ul class="timeline" id="d-timeline"></ul>

  <div id="d-pasti"></div>

  <nav class="day-nav">
    <a id="nav-prev" href="#">← giorno prec.</a>
    <a id="nav-next" href="#">giorno succ. →</a>
  </nav>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="data.js"></script>

</body>
