<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viaggio in Giappone</title>
<script>
(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect x='2' y='0' width='3' height='1' fill='%23c1440e'/%3E%3Crect x='1' y='1' width='5' height='1' fill='%23c1440e'/%3E%3Crect x='0' y='2' width='7' height='1' fill='%23c1440e'/%3E%3Crect x='0' y='3' width='8' height='1' fill='%23c1440e'/%3E%3Crect x='1' y='4' width='7' height='1' fill='%23c1440e'/%3E%3Crect x='2' y='5' width='5' height='1' fill='%23c1440e'/%3E%3Crect x='3' y='6' width='3' height='1' fill='%23c1440e'/%3E%3Crect x='4' y='7' width='1' height='1' fill='%23c1440e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="pixel-leaf" viewBox="0 0 8 8">
    <rect x="2" y="0" width="3" height="1"/>
    <rect x="1" y="1" width="5" height="1"/>
    <rect x="0" y="2" width="7" height="1"/>
    <rect x="0" y="3" width="8" height="1"/>
    <rect x="1" y="4" width="7" height="1"/>
    <rect x="2" y="5" width="5" height="1"/>
    <rect x="3" y="6" width="3" height="1"/>
    <rect x="4" y="7" width="1" height="1"/>
  </symbol>
</svg>
<header class="top">
  <div class="top-bar">
    <span class="brand-mark"><svg class="leaf-icon" viewBox="0 0 8 8"><use href="#pixel-leaf"></use></svg><span>秋の旅</span></span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambia tema"></button>
  </div>
  <h1 id="trip-title"></h1>
  <p id="trip-subtitle"></p>
  <div id="global-search" class="global-search"></div>
</header>
<nav class="quicknav">
  <a href="#giorni">📅 Giorni</a>
  <a href="#scadenze">✅ Scadenze</a>
  <a href="#hotel">🏨 Hotel</a>
  <a href="#voli">✈️ Voli</a>
  <a href="#note">💡 Note</a>
</nav>
<main>

  <section id="giorni">
    <h2>📅 Giorno per giorno</h2>
    <div id="days-grid" class="days-grid"></div>
  </section>

  <section id="scadenze">
    <h2>✅ Scadenze e prenotazioni</h2>
    <p class="legenda" id="legenda"></p>
    <div id="scadenze-list"></div>
  </section>

  <section id="hotel">
    <h2>🏨 Hotel</h2>
    <div id="hotel-list"></div>
  </section>

  <section id="voli">
    <h2>✈️ Voli</h2>
    <div id="flight-list"></div>
  </section>

  <section id="note">
    <h2>💡 Note pratiche</h2>
    <div id="note-rapide"></div>
  </section>

</main>
<footer>Aggiornato tramite Claude — parla con lui per modificare il piano.</footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById("legenda").textContent = window.TRIP.legenda.join("  ·  ");
  renderIndex();
  renderSearch();
  initTheme();
  initLeaves();
</script>
</body>
</html>
